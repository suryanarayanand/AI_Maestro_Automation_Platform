appId: com.mobstac.thehindu
tags: [common, subscriber, search, article]
---
- runFlow: "OPEN_SUBSCRIBER_SEARCH.yaml"
- tapOn: {point: "45%,8%"}
- eraseText: 100
- inputText: "India"
- pressKey: ENTER
- extendedWaitUntil: {visible: {id: "article_card"}, timeout: 60000}
- tapOn: {id: "article_card", index: 0}
- waitForAnimationToEnd
- runFlow: "HANDLE_AI_SUMMARY_SHEET.yaml"
- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 30000}
- assertVisible: {id: "screen_article_detail"}
