appId: com.mobstac.thehindu
tags: [common, anonymous, opinion, article]
---
- runFlow: "OPEN_ANONYMOUS_OPINION.yaml"
- tapOn: {point: "50%,50%"}
- waitForAnimationToEnd
- runFlow:
    when: {notVisible: {id: "screen_article_detail"}}
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: "Screenshots/Generated/opinion_possible_interstitial"
      - repeat:
          times: 12
          commands:
            - waitForAnimationToEnd: {timeout: 5000}
            - runFlow:
                when: {visible: {text: "^CLOSE$|Interstitial close button|SKIP|Skip Ad"}}
                commands:
                  - takeScreenshot: "Screenshots/Generated/opinion_interstitial_close_ready"
                  - tapOn: {text: "^CLOSE$|Interstitial close button|SKIP|Skip Ad"}
- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 30000}
- assertVisible: {id: "screen_article_detail"}

