appId: com.mobstac.thehindu
tags: [common, subscriber, login, single-entry]
---
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Email"
- inputText: ${TEST_EMAIL}
- extendedWaitUntil:
    visible: "NEXT.*|Next.*"
    timeout: 15000
- tapOn:
    text: "NEXT.*|Next.*"
- extendedWaitUntil:
    visible: "password"
    timeout: 30000
- tapOn: "password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- extendedWaitUntil:
    visible: "LOGIN→"
    timeout: 15000
- tapOn: "LOGIN→"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "^Account$"
    timeout: 30000
