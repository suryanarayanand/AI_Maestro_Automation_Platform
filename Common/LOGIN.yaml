appId: com.mobstac.thehindu
tags:
  - common
  - authenticated
---
# Local-only test credentials. Restore environment injection before sharing.
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- runFlow:
    when:
      visible: "HAVE AN ACCOUNT? LOGIN"
    commands:
      - tapOn: "HAVE AN ACCOUNT? LOGIN"
- waitForAnimationToEnd


- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Email"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- waitForAnimationToEnd

# Some WebView sessions reset to the native anonymous account drawer after
# email entry. Recover through its validated Login control and enter once more.
- runFlow:
    when:
      visible:
        id: "cta_login"
    commands:
      - tapOn:
          id: "cta_login"
      - extendedWaitUntil:
          visible: "Email"
          timeout: 30000
      - tapOn: "Email"
      - inputText: ${TEST_EMAIL}
      - hideKeyboard
      - waitForAnimationToEnd

# The authentication WebView occasionally resets to the onboarding login entry.
# Wait for either the expected NEXT action or the reset state, then recover once.
- extendedWaitUntil:
    visible: "NEXT.*|Next.*|HAVE AN ACCOUNT.*LOGIN"
    timeout: 30000
- runFlow:
    when:
      visible: "HAVE AN ACCOUNT.*LOGIN"
    commands:
      - tapOn: "HAVE AN ACCOUNT.*LOGIN"
      - extendedWaitUntil:
          visible: "Email"
          timeout: 30000
      - tapOn: "Email"
      - inputText: ${TEST_EMAIL}
      - hideKeyboard
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "NEXT.*|Next.*"
    timeout: 30000
- tapOn:
    text: "NEXT.*|Next.*"




- extendedWaitUntil:
    visible: "password"
    timeout: 30000
- tapOn: "password"
- inputText: ${TEST_PASSWORD}
- runFlow:
    when:
      visible:
        text: "Show password"
    commands:
      - tapOn: "Show password"
- waitForAnimationToEnd
- hideKeyboard

- extendedWaitUntil:
    visible: "LOGIN.*"
    timeout: 15000
- tapOn: "LOGIN.*"

# Successful authentication returns to the authenticated account drawer.
- extendedWaitUntil:
    visible: "^Account$"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "cta_menu_close"
    commands:
      - tapOn:
          id: "cta_menu_close"
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 30000
