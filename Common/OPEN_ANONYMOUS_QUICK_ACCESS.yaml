appId: com.mobstac.thehindu
tags: [common, anonymous, quick-access]
---
- runFlow: OPEN_ANONYMOUS_HOME.yaml
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              text: "(?i)^${SECTION_NAME}$"
          commands:
            - swipe: {start: "88%,14%", end: "12%,14%", duration: 500}
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "(?i)^${SECTION_NAME}$"
    timeout: 30000
- tapOn:
    text: "(?i)^${SECTION_NAME}$"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 30000
