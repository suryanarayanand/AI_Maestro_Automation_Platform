appId: com.mobstac.thehindu
tags:
  - locator-capture
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 20000
- tapOn:
    id: "nav_menu"
- extendedWaitUntil:
    visible:
      id: "screen_hamburger"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "${CATEGORY}"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "${CATEGORY}"
- extendedWaitUntil:
    visible:
      text: "${CHILD_SECTION}"
    timeout: 15000
- tapOn:
    text: "${CHILD_SECTION}"
    index: 1
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${PAGE_TITLE}"
    timeout: 20000
- takeScreenshot: "Screenshots/LocatorCapture/${CAPTURE_NAME}"
