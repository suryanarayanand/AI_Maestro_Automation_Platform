appId: com.mobstac.thehindu
tags:
  - locator-capture
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 20000
- tapOn:
    id: "nav_menu"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_hamburger"
    timeout: 20000
- takeScreenshot: "Screenshots/LocatorCapture/hamburger_menu"
