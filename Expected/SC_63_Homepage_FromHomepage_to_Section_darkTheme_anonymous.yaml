appId: com.mobstac.thehindu
tags:
  - anonymous
  - dark_theme
  - home
  - theme
---
# Homepage FromHomepage to Section darkTheme anonymous (SC-63).
# Launch App
- launchApp:
    clearState: true

# Accept Terms and Conditions
# - runFlow: ../Common/OOBE_terms_and_condition.yaml

# Skip Onboarding
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"

# Verify Anonymous Home Page
- assertVisible: "SUBSCRIBE"

# Navigate to Appearance Settings
- tapOn:
    point: 88%,5%
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
- tapOn: "Appearance"

# Verify Change Theme Option
- assertVisible: "Dark\nMode"
- tapOn: "Dark\nMode"
- back

# Relaunch the App Because Navigating Back Causes the App to Crash
# - stopApp
- launchApp

# Navigate to Science Section
- repeat:
    times: 25
    commands:
      - scroll
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Science"
    commands:
      - takeScreenshot: "Screenshots/SC_63/SC_63_Science_Section"

# - swipe:
#     direction: DOWN
# Open First Article
- tapOn:
    text: "SCIENCE"
    index: 1

# - tapOn:
#     point: 63%,29%
# Article Validation
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Article_01"
- scroll
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Article_02"
- scroll
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Article_03"
- scroll
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Article_04"
- scroll
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Article_05"
- scroll
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Article_06"
- scroll
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Article_07"

# Navigate Back
- back

# Relaunch the App Because Navigating Back Causes the App to Crash
# - stopApp
- launchApp

# Navigate to Science Section
- repeat:
    times: 25
    commands:
      - scroll
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Science"
    commands:
      - takeScreenshot: "Screenshots/SC_63/SC_63_Science_Section"

# - swipe:
#     direction: DOWN
# Open Science Carousel
- tapOn:
    text: "SCIENCE"
    index: 1

# - tapOn:
#     point: 63%,29%
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Carousel_01"
- swipe:
    direction: LEFT
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Carousel_02"
- swipe:
    direction: LEFT
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Carousel_03"
- swipe:
    direction: LEFT
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Carousel_04"
- swipe:
    direction: LEFT
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Carousel_05"
- swipe:
    direction: LEFT
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Carousel_06"
- swipe:
    direction: LEFT
- takeScreenshot: "Screenshots/SC_63/SC_63_Science_Carousel_07"

# Navigate Back
- back

# Close Application
- stopApp
