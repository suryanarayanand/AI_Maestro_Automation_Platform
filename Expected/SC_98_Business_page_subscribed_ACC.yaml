appId: com.mobstac.thehindu
tags:
  - subscriber
  - business
---
# Business page subscribed ACC (SC-98).
# Launch App
- launchApp:
    clearState: true

# Accept Terms and Conditions
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- waitForAnimationToEnd

# Login
- runFlow: ../Common/LOGIN.yaml

# Skip Onboarding
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Verify Logged-In Account
- assertNotVisible: "SUBSCRIBE"

# Navigate to Business Section
- repeat:
    times: 5
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Business"
    commands:
      - tapOn: "Business"

# Verify Business Section
- takeScreenshot: "Screenshots/SC_98/SC_98_Business_Page_Subscribed_Account_01"
