appId: com.mobstac.thehindu
tags:
  - anonymous
  - sports
  - account
---
# Sports page anonymous account (SC-91).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"
- assertVisible: "SUBSCRIBE"
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Navigate to Sports Section
- repeat:
    times: 4
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Sports"
    commands:
      - tapOn: "Sports"

# Sports Page Validation
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_01"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_02"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_03"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_04"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_05"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_06"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_07"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_08"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_09"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_10"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_11"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_12"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_91/SC_91_SportsPage_Anonymous_Account_13"

# Verify Advertisements
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            visible:
              text: "ADVERTISEMENT"
          commands:
            - takeScreenshot: "Screenshots/SC_91/SC_91_Advertisement"
      - scroll
      - waitForAnimationToEnd

# Navigate Up
- repeat:
    times: 20
    commands:
      - swipe:
          direction: DOWN

# Verify Taboola Advertisements
- repeat:
    times: 25
    commands:
      - runFlow:
          when:
            visible:
              text: "Image for Taboola Advertising Unit"
          commands:
            - takeScreenshot: "Screenshots/SC_91/SC_91_Taboola_Ad_${TIMESTAMP}"
      - scroll

# Navigate Up
- repeat:
    times: 20
    commands:
      - swipe:
          direction: DOWN

# Verify Support Journalism Section
- repeat:
    times: 25
    commands:
      - runFlow:
          when:
            visible:
              text: "Support Journalism"
          commands:
            - takeScreenshot: "Screenshots/SC_91/SC_91_Support_Journalism_Popup_${TIMESTAMP}"
      - scroll
