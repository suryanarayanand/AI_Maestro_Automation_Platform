appId: com.mobstac.thehindu
tags:
  - anonymous
  - light_theme
  - editorial
  - theme
---
# Editorial Page anonymous light theme (SC-86).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "SUBSCRIBE"
    timeout: 15000

# Change to Light Theme
- extendedWaitUntil:
    visible: "Account"
    timeout: 15000
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
- tapOn: "Appearance"
- assertVisible: "Light\nMode"
- tapOn: "Light\nMode"
- back

# Relaunch the app because navigating back causes the app to crash.
# - stopApp
- launchApp

# Navigate to Editorial Section
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "SUBSCRIBE"
    timeout: 15000
- extendedWaitUntil:
    visible: "Editorial"
    timeout: 15000
- tapOn: "Editorial"

# Editorial Page Validation
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Anonymous_Account_LightTheme_01"
- scroll
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Anonymous_Account_LightTheme_02"
- scroll
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Anonymous_Account_LightTheme_03"
- scroll
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Anonymous_Account_LightTheme_04"
- scroll
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Anonymous_Account_LightTheme_05"

# Open Editorial Article
- tapOn:
    point: 7%,41%
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Specific_Article_LightTheme_01"
- scroll
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Specific_Article_LightTheme_02"
- scroll
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Specific_Article_LightTheme_03"
- scroll
- takeScreenshot: "Screenshots/SC_86/SC_86_Editorial_Page_Specific_Article_LightTheme_04"
- scroll

# Verify Article Actions
- assertVisible:
    text: "Text size"
- waitForAnimationToEnd
- assertVisible:
    text: "Bookmark"
- assertVisible:
    text: "Share"
- assertVisible:
    text: "Comment"
- waitForAnimationToEnd
- assertVisible:
    text: "Listen to article"

# Navigate to Comments Section
- repeat:
    times: 20
    commands:
      - swipe:
          direction: DOWN

# Verify Post a Comment Section
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            visible:
              text: "Post a comment"
          commands:
            - takeScreenshot: "Screenshots/SC_86/SC_86_Post_A_Comment_LightTheme"
      - scroll

