appId: com.mobstac.thehindu
tags:
  - bookmark
---
# bookmark presistance (SC-43).
# Launch App
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 8000

# Accept Terms and Conditions
# - runFlow: ../Common/OOBE_terms_and_condition.yaml

# Login
- runFlow: ../Common/LOGIN.yaml

# Skip Onboarding
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Navigate to India Section
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "India"
    timeout: 15000
- tapOn: "India"

# Close Promotional Popup (Commented)
# - runFlow:
#     when:
#       visible:
#         text: "Dear Reader, this event is free for you to attend."
#     commands:
#       - back
# - waitForAnimationToEnd:
#     timeout: 5000
# Open Specific Article
- scrollUntilVisible:
    element: "NIA court issues non-bailable warrant against LeT founder Hafiz Saeed"
- tapOn: "NIA court issues non-bailable warrant against LeT founder Hafiz Saeed"

# Close Summary Popup
- runFlow:
    when:
      visible:
        text: "Summary"
    commands:
      - back

# Article Validation
- takeScreenshot: "Screenshots/SC_43/SC_43_Article"

# Bookmark Article
- runFlow:
    when:
      visible:
        text: "Remove bookmark"
    commands:
      - tapOn: "Remove bookmark"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Bookmark"
    commands:
      - tapOn: "Bookmark"

# Verify Bookmark Success
- runFlow:
    when:
      visible:
        text: "success"
    commands:
      - takeScreenshot: "Screenshots/SC_43/SC_43_Bookmark_Success"

# Relaunch the App
- killApp
- launchApp

# Close Promotional Popup (Commented)
# - runFlow:
#     when:
#       visible:
#         text: "Dear Reader, this event is free for you to attend."
#     commands:
#       - back
# Navigate to Bookmarks
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000
- assertVisible: "Account"
- tapOn: "Account"

# Close Promotional Popup (Commented)
# - runFlow:
#     when:
#       visible:
#         text: "Dear Reader, this event is free for you to attend."
#     commands:
#       - back
- extendedWaitUntil:
    visible:
      text: "Bookmarks"
    timeout: 10000
- assertVisible: "Bookmarks"
- tapOn: "Bookmarks"

# Verify Bookmarked Article
- assertVisible: "NIA court issues non-bailable warrant against LeT founder Hafiz Saeed [read]"
- takeScreenshot: "Screenshots/SC_43/SC_43_Bookmarks_Page"

# Close Application
- killApp
