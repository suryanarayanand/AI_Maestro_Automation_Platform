appId: com.mobstac.thehindu
tags:
  - subscriber
  - article
---
# Subscriber Article Full Read Access (SC-12).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow: ../Common/LOGIN.yaml

# Skip Onboarding
- assertVisible:
    text: "Welcome to a new\nThe Hindu experience"
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Open Home Article
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    point: 64%,27%
- waitForAnimationToEnd

# Capture Article Title
- copyTextFrom:
    point: 50%,12%
- evalScript: ${output.articleTitle = maestro.copiedText}
- evalScript: ${console.log(output.articleTitle)}

# Verify Subscribe Option is Absent
- repeat:
    times: 10
    commands:
      - assertNotVisible:
          text: "SUBSCRIBE"
      - scroll
      - waitForAnimationToEnd

# Subscriber Article Validation
- takeScreenshot: "Screenshots/SC_12/SC_12_Subscriber_Article_page"

# Verify Subscribe Option is Absent Again
- repeat:
    times: 10
    commands:
      - assertNotVisible:
          text: "SUBSCRIBE"
      - scroll
      - waitForAnimationToEnd

# Continue Subscriber Article Validation
- takeScreenshot: "Screenshots/SC_12/SC_12_Subscriber_Article_page_1"
