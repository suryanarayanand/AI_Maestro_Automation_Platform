appId: com.mobstac.thehindu
tags:
  - premium
---
# Premium page verification (SC-47).
# Launch App
- launchApp:
    clearState: true

# Accept Terms and Conditions
# - runFlow: ../Common/OOBE_terms_and_condition.yaml

# Login
- runFlow: ../Common/LOGIN.yaml

# Skip Onboarding
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Navigate to Premium Section
- extendedWaitUntil:
    visible: "Premium"
    timeout: 15000
- tapOn: "Premium"

# Dismiss OKAY Popup
- runFlow:
    when:
      visible:
        text: "OKAY"
    commands:
      - tapOn: "OKAY"

# Premium Page Validation
