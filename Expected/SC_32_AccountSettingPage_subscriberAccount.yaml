# AccountSettingPage subscriberAccount (SC-32).
- launchApp:
    clearState: true
- waitForAnimationToEnd
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow: ../Common/LOGIN.yaml
- extendedWaitUntil:
    visible: "Skip"
    timeout: 5000
- tapOn: "Skip"
- tapOn: "Account"
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_32/SC_32_AccountSettingpage"
- takeScreenshot: "Screenshots/SC_32/SC_32_AccountSettingpage_01"
- assertVisible: "ACCOUNT SETTINGS"
- extendedWaitUntil:
    visible:  "Account"
    timeout: 5000
- tapOn: "Account"
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_32/SC_32_AccountPage"
- extendedWaitUntil:
    visible:  "My Account"
    timeout: 2500000
- takeScreenshot: "Screenshots/SC_32/SC_32_MY_AccountPage_details"
- extendedWaitUntil:
    visible:  "PROFILE"
    timeout: 2500000
- extendedWaitUntil:
    visible:  "General"
