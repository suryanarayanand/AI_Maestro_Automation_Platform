appId: com.mobstac.thehindu
tags: [generated, ordered, anonymous, editorial]
---
- runFlow: "../Common/OPEN_ANONYMOUS_EDITORIAL.yaml"
- tapOn: {id: "article_card", index: 0}
- waitForAnimationToEnd
- runFlow:
    when: {notVisible: {id: "screen_article_detail"}}
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: "Screenshots/Generated/ANON_EDITORIAL_015_interstitial"
      - repeat:
          times: 12
          commands:
            - waitForAnimationToEnd
            - runFlow:
                when: {visible: {text: "^CLOSE$|Interstitial close button|SKIP|Skip Ad"}}
                commands:
                  - tapOn: {text: "^CLOSE$|Interstitial close button|SKIP|Skip Ad"}
- assertVisible: {id: "screen_article_detail"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_EDITORIAL_015_article_restored"
