appId: com.mobstac.thehindu
tags:
  - back_navigation
  - stress_test
---
# Back Button Stress Test (SC-53).
# Launch App
- launchApp:
    clearState: true
    # stopApp: true
- waitForAnimationToEnd

# Accept Terms and Conditions
# - runFlow: ../Common/OOBE_terms_and_condition.yaml

# Login
- runFlow: ../Common/LOGIN.yaml

# Skip Onboarding
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Navigate to India Section
- extendedWaitUntil:
    visible: "Trending"
- extendedWaitUntil:
    visible: "India"
- tapOn:
    text: "India"

# Open First Article
- tapOn:
    point: 63%,77%
- extendedWaitUntil:
    visible: "Share"

# Close Summary Popup
- runFlow:
    when:
      visible:
        text: "Summary"
    commands:
      - back

# Article Validation
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_53/SC_53_Article"

# Navigate Back
- pressKey: Back
- assertVisible: "Top News"
- takeScreenshot: "Screenshots/SC_53/SC_53_Home_Page"

# Close Application
- killApp
