appId: com.mobstac.thehindu
tags:
  - generated
  - ordered
  - subscriber
  - search
  - case-consistency
  - evidence
---

# Establish a fresh authenticated Subscriber Home state.
- runFlow: "../Common/OPEN_SUBSCRIBER_HOME.yaml"

# Position 1: Open Search, submit the uppercase query, capture its settled
# result state, and then clear the rendered query.
- extendedWaitUntil:
    visible:
      id: "cta_search"
    timeout: 30000

- assertVisible:
    id: "cta_search"

- tapOn:
    id: "cta_search"

- waitForAnimationToEnd

# Remove any query retained from an earlier execution.
- eraseText: 100

- inputText: "INDIA"

- pressKey: ENTER

- extendedWaitUntil:
    visible:
      id: "article_card"
    timeout: 30000

- assertVisible:
    text: "^INDIA$"

- assertVisible:
    id: "article_card"
    index: 0

# Preserve the first result card's accessible text as the executable comparison
# oracle for the lowercase search.
- copyTextFrom:
    id: "article_card"
    index: 0

- evalScript: ${output.uppercaseFirstResult = maestro.copiedText}

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_SEARCH_022_uppercase_india_results"

# Refocus the rendered uppercase query using the approved replacement pattern.
- tapOn:
    text: "^INDIA$"

- eraseText: 100

- assertNotVisible:
    text: "^INDIA$"

# Position 2: Submit the lowercase form and obtain its settled result state.
- inputText: "india"

- pressKey: ENTER

- extendedWaitUntil:
    visible:
      id: "article_card"
    timeout: 30000

- assertVisible:
    text: "^india$"

- assertVisible:
    id: "article_card"
    index: 0

- copyTextFrom:
    id: "article_card"
    index: 0

# Position 4: The same first result must be presented for both query casings.
- assertTrue: ${maestro.copiedText == output.uppercaseFirstResult}

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_SEARCH_022_lowercase_india_consistent_results"
