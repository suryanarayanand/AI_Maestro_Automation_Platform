appId: com.mobstac.thehindu
tags: [generated, subscriber, photos, gallery, metadata]
---
- runFlow: "../Common/OPEN_SUBSCRIBER_MULTI_PHOTO_GALLERY.yaml"
- waitForAnimationToEnd
- assertVisible: {text: ".*1/[2-9][0-9]*.*"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_PHOTO_008_image_1_metadata"
- swipe: {direction: LEFT, duration: 500}
- waitForAnimationToEnd
- assertVisible: {text: ".*2/[0-9]+.*"}
- assertNotVisible: "SUBSCRIBE"
- assertNotVisible: {id: "ad_iframe"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_PHOTO_008_image_2_metadata"
- swipe: {direction: RIGHT, duration: 500}
- waitForAnimationToEnd
- assertVisible: {text: ".*1/[0-9]+.*"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_PHOTO_008_metadata_restored"
