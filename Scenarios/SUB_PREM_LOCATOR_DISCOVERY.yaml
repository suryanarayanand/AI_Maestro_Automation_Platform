appId: com.mobstac.thehindu
tags: [discovery, subscriber, premium, locators]
---
- runFlow: "../Common/OPEN_SUBSCRIBER_PREMIUM.yaml"
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_landing"
- assertVisible: {id: "screen_premium"}
- runFlow:
    when: {visible: {text: "Specials"}}
    commands:
      - tapOn: {text: "Specials"}
      - waitForAnimationToEnd
      - takeScreenshot: "Screenshots/Discovery/SUB_PREM_specials_top"
- repeat:
    times: 4
    commands:
      - swipe: {direction: UP}
      - waitForAnimationToEnd: {timeout: 1600}
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_specials_scrolled"
- extendedWaitUntil: {visible: {id: "article_card"}, timeout: 30000}
- tapOn: {id: "article_card", index: 0}
- tapOn: {text: "Close sheet", optional: true}
- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 30000}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_article_header"
- repeat:
    times: 4
    commands:
      - swipe: {direction: UP}
      - waitForAnimationToEnd: {timeout: 1600}
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_article_middle"
- repeat:
    times: 6
    commands:
      - swipe: {direction: UP}
      - waitForAnimationToEnd: {timeout: 1600}
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_article_lower"
- assertNotVisible: {text: "SUBSCRIBE|Already a subscriber.*|Keep reading.*|Login to your account"}
- runFlow: "../Common/ASSERT_SUBSCRIBER_NO_MONETIZATION.yaml"
