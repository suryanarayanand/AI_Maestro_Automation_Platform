- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 45000}
- assertVisible: {id: "screen_article_detail"}
- runFlow: "../Common/ASSERT_SUBSCRIBER_NO_MONETIZATION.yaml"
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_LATEST_005_article_destination"
