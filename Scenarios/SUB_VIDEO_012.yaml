appId: com.mobstac.thehindu

tags:
  - generated
  - ordered
  - subscriber
  - video
  - entitlement
  - no-monetisation
  - evidence-limited

---

# SUB_VIDEO_012
# Establish the configured authenticated subscriber session. Credentials are
# owned by the shared setup flow and are not duplicated here.
- runFlow: "../Common/OPEN_SUBSCRIBER_HOME.yaml"

# Position 1: Verify the validated Videos entry is rendered. The repository does
# not currently provide a validated clickable Videos control or Videos-list
# screen identifier, so navigation through the listing is not fabricated.
- extendedWaitUntil:
    visible:
      text: "Videos"
    timeout: 30000

- assertVisible:
    text: "Videos"

- assertNotVisible:
    text: "SUBSCRIBE"

- assertNotVisible:
    text: "ADVERTISEMENT"

- assertNotVisible:
    id: "ad_iframe"

- assertNotVisible:
    id: "aw0"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_VIDEO_012_videos_entry_subscriber"

# Open the supplied Vertical Video article reference. Runtime validation of
# screen_article_detail prevents an unresolved or incorrectly routed URL from
# being treated as successful article access.
- openLink: "https://www.thehindu.com/videos/watch-looking-back-at-2024-what-are-the-words-that-dominated-social-media/article69045733.ece"

- extendedWaitUntil:
    visible:
      id: "screen_article_detail"
    timeout: 30000

- assertVisible:
    id: "screen_article_detail"

# Position 2: Check every supplied, semantically grounded monetisation selector
# at the initial article state.
- assertNotVisible:
    text: "ADVERTISEMENT"

- assertNotVisible:
    id: "ad_iframe"

- assertNotVisible:
    text: "SUBSCRIBE"

- assertNotVisible:
    id: "aw0"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_VIDEO_012_video_article_top_entitled"

# Positions 1 and 3: Traverse bounded lower article states. Persistence of the
# validated article-detail screen proves that the opened article remains
# accessible; no unsupported playback or fullscreen control is fabricated.
- repeat:
    times: 6
    commands:
      - swipe:
          direction: UP
      - waitForAnimationToEnd
      - assertVisible:
          id: "screen_article_detail"
      - assertNotVisible:
          text: "ADVERTISEMENT"
      - assertNotVisible:
          id: "ad_iframe"
      - assertNotVisible:
          text: "SUBSCRIBE"
      - assertNotVisible:
          id: "aw0"

- assertVisible:
    id: "screen_article_detail"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_VIDEO_012_video_article_lower_entitled"

# Position 4: Final settled proof that validated monetisation surfaces have not
# blocked or displaced the subscriber's article-detail surface.
- assertVisible:
    id: "screen_article_detail"

- assertNotVisible:
    text: "ADVERTISEMENT"

- assertNotVisible:
    id: "ad_iframe"

- assertNotVisible:
    text: "SUBSCRIBE"

- assertNotVisible:
    id: "aw0"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_VIDEO_012_final_no_monetisation"
