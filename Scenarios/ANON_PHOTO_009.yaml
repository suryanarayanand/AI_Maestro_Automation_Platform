appId: com.mobstac.thehindu
tags: [generated, ordered, anonymous, photos]
---
- runFlow: "../Common/OPEN_ANONYMOUS_MULTI_PHOTO_GALLERY.yaml"
- swipe: {direction: LEFT, duration: 500}
- waitForAnimationToEnd
- scrollUntilVisible:
    element: {text: "READ FULL ARTICLE"}
    direction: DOWN
    timeout: 30000
    speed: 40
- assertVisible: {text: "READ FULL ARTICLE"}
- tapOn: {text: "READ FULL ARTICLE"}
- waitForAnimationToEnd
- assertNotVisible: {text: "READ FULL ARTICLE"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_PHOTO_009_expanded_article"
