appId: com.mobstac.thehindu
tags: [generated, ordered, anonymous, editorial]
---
- runFlow: "../Common/OPEN_ANONYMOUS_EDITORIAL_ARTICLE.yaml"
- tapOn: {text: "Subscribe|SUBSCRIBE", index: 0}
- extendedWaitUntil: {visible: {text: "Yearly|Monthly|Choose a plan|View offers|Offer"}, timeout: 30000}
- assertVisible: {text: "Yearly|Monthly|Choose a plan|View offers|Offer"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_EDITORIAL_013_plans"
- back
- scrollUntilVisible:
    element: {text: "Already a subscriber.*|Login"}
    direction: DOWN
    timeout: 90000
    speed: 55
- tapOn: {text: "Already a subscriber.*|Login|LOGIN"}
- assertVisible: {text: "Login to your account"}
