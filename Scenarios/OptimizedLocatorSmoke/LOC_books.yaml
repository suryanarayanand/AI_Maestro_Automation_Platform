appId: com.mobstac.thehindu
tags:
  - locator-smoke
  - books
---
- runFlow: ../../Common/OPEN_HOME_FOR_LOCATOR_SMOKE.yaml
- tapOn:
    id: "nav_menu"
- extendedWaitUntil:
    visible:
      id: "screen_hamburger"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Books"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Books"
- extendedWaitUntil:
    visible:
      text: "Books"
    timeout: 15000
- tapOn:
    text: "Books"
    index: 1
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_section"
    timeout: 20000
- assertVisible:
    id: "screen_section"
- assertVisible:
    text: "Books"
- takeScreenshot: "Screenshots/LocatorSmoke/books_page"
