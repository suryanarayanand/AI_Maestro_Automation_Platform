appId: com.mobstac.thehindu
tags:
  - locator-smoke
  - opinion
---
- runFlow: ../Common/OPEN_HOME_FOR_LOCATOR_SMOKE.yaml
- tapOn:
    text: "Opinion"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 20000
- assertVisible:
    id: "screen_home"
- assertVisible:
    text: "Opinion"
- takeScreenshot: "Screenshots/LocatorSmoke/opinion_page"
