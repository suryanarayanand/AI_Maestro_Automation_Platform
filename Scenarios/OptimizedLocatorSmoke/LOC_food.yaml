appId: com.mobstac.thehindu
tags:
  - locator-smoke
  - food
---
- runFlow: ../Common/OPEN_HOME_FOR_LOCATOR_SMOKE.yaml
- tapOn:
    id: "nav_menu"
- extendedWaitUntil:
    visible:
      id: "screen_hamburger"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Life & Style"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Life & Style"
- extendedWaitUntil:
    visible:
      text: "Food"
    timeout: 15000
- tapOn:
    text: "Food"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_section"
    timeout: 20000
- assertVisible:
    id: "screen_section"
- assertVisible:
    text: "Food"
- takeScreenshot: "Screenshots/LocatorSmoke/food_page"
