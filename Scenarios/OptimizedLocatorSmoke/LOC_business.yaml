appId: com.mobstac.thehindu
tags:
  - locator-smoke
  - business
---
- runFlow: ../../Common/OPEN_HOME_FOR_LOCATOR_SMOKE.yaml
- repeat:
    times: 5
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Business"
    timeout: 15000
- tapOn:
    text: "Business"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 20000
- assertVisible:
    id: "screen_home"
- assertVisible:
    text: "Business"
- takeScreenshot: "Screenshots/LocatorSmoke/business_page"
