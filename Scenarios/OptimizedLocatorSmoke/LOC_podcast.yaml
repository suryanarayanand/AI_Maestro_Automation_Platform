appId: com.mobstac.thehindu
tags:
  - locator-smoke
  - podcast
---
- runFlow: ../../Common/OPEN_HOME_FOR_LOCATOR_SMOKE.yaml
- tapOn:
    text: "Podcast"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 20000
- assertVisible:
    id: "screen_home"
- assertVisible:
    text: "Podcast"
- takeScreenshot: "Screenshots/LocatorSmoke/podcast_page"
