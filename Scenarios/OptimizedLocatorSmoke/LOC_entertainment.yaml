appId: com.mobstac.thehindu
tags:
  - locator-smoke
  - entertainment
---
- runFlow: ../Common/OPEN_HOME_FOR_LOCATOR_SMOKE.yaml
- tapOn:
    id: "nav_menu"
- extendedWaitUntil:
    visible:
      id: "screen_hamburger"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Entertainment"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Entertainment"
- extendedWaitUntil:
    visible:
      text: "Entertainment"
    timeout: 15000
- tapOn:
    text: "Entertainment"
    index: 1
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_section"
    timeout: 20000
- assertVisible:
    id: "screen_section"
- assertVisible:
    text: "Entertainment"
- takeScreenshot: "Screenshots/LocatorSmoke/entertainment_page"
