appId: com.mobstac.thehindu
tags:
  - account
---
# Create New Account Option (SC-18).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml

# Verify Initial Setup Screen
- extendedWaitUntil:
    visible: "Save articles to read later"
    timeout: 15000
- extendedWaitUntil:
    visible: "Unlock more stories"
    timeout: 15000
- takeScreenshot: "Screenshots/SC_18/SC_18_intialSetupScreen_01"

# Navigate to Sign Up Page
- extendedWaitUntil:
    visible: "CREATE A FREE ACCOUNT"
    timeout: 15000
- tapOn: "CREATE A FREE ACCOUNT"
- extendedWaitUntil:
    visible: "thehindu-logo"
    timeout: 15000
- extendedWaitUntil:
    visible: "Already have an account? "
    timeout: 15000
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000
- assertVisible: "Sign in with Apple"
- assertVisible: "Sign in with Google"
- assertVisible: "Sign up"
- tapOn: "Sign up"
- takeScreenshot: "Screenshots/SC_18/SC_18_SignUp_page"

# Verify Sign Up Page Elements
- extendedWaitUntil:
    visible: "Email"
    timeout: 15000
- extendedWaitUntil:
    visible: "Password"
    timeout: 15000

- extendedWaitUntil:
    visible: "I'd like to receive updates and offers from THG via email and messages"
    timeout: 15000
- extendedWaitUntil:
    visible: "Stay logged in"
    timeout: 15000
- extendedWaitUntil:
    visible: "Contact me via Whatsapp"
    timeout: 15000
- extendedWaitUntil:
    visible: "Terms of Use"
    timeout: 15000
- extendedWaitUntil:
    visible: "Privacy Policy"
    timeout: 15000
- extendedWaitUntil:
    visible: "SIGN UP →"
    timeout: 15000



# Enter Registration Details
- tapOn: "email"
- inputRandomEmail
- tapOn: "password"
- inputText: "Test@123"
- tapOn:
    point: 6%,50%

- inputRandomNumber:
    length: 10
- tapOn: "Show password"
- extendedWaitUntil:
    visible: "SIGN UP →"
    timeout: 15000
- tapOn: "SIGN UP →"

# Verify CAPTCHA Validation
- runFlow:
    when:
      visible:
        text: "Sign up"
    commands:
      - assertVisible: "Captcha validation failed. If you are not a bot then please try again."
      - takeScreenshot: "Screenshots/SC_18/SC_18_captcha_is_observed"

# Close Application
- killApp
