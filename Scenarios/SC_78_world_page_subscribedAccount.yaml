# Navigate to Taboola Advertisement Section
- repeat:
    times: 20
    commands:
      - swipe:
          direction: DOWN

# Verify Taboola Advertisement is Absent
- repeat:
    times: 20
    commands:
      - assertNotVisible:
          text: "Image for Taboola Advertising Unit"
      - scroll
      - takeScreenshot: "Screenshots/SC_78/SC_78_Taboola_Advertisement_Verification"
      - waitForAnimationToEnd
