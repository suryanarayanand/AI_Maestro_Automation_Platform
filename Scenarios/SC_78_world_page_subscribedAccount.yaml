appId: com.mobstac.thehindu
tags:
  - subscriber
  - world
  - account
---
# world page subscribedAccount (SC-78).
# Launch App
- launchApp:
    clearState: true
- waitForAnimationToEnd
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow: ../Common/LOGIN.yaml

# Skip Onboarding
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"

# Navigate to World Section
- extendedWaitUntil:
    visible: "The Hindu"
    timeout: 15000
- extendedWaitUntil:
    visible: "World"
    timeout: 15000
- tapOn: "World"

# Refresh World Page
- swipe:
    direction: DOWN
- takeScreenshot: "Screenshots/SC_78/SC_78_World_Page_After_Refresh"

# World Page Validation
- takeScreenshot: "Screenshots/SC_78/SC_78_World_Page_01"
- scroll
- takeScreenshot: "Screenshots/SC_78/SC_78_World_Page_02"
- scroll
