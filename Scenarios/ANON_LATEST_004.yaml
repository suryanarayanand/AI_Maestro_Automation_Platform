appId: com.mobstac.thehindu
tags: [anonymous, quick-access, latest]
---
- runFlow:
    file: "../Common/OPEN_ANONYMOUS_QUICK_ACCESS.yaml"
    env:
      SECTION_NAME: "Latest News"

- repeat:
    times: 5
    commands:
      - swipe: {direction: UP, duration: 600}
      - waitForAnimationToEnd
- assertVisible: {id: "screen_home"}

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_LATEST_004_deep_scroll"

- runFlow:
    when: {visible: {text: "(?i)ADVERTISEMENT|Advertisement"}}
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: "Screenshots/Generated/ANON_LATEST_004_advertisement"
