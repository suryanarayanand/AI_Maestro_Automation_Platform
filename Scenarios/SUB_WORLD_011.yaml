- assertVisible:

    id: "screen_article_detail"



- assertNotVisible:

    id: "ad_iframe"



- assertNotVisible:

    text: "ADVERTISEMENT"



- runFlow: "../Common/ASSERT_SUBSCRIBER_NO_MONETIZATION.yaml"



- assertWithAI: "Verify the first left pager gesture has settled on a valid readable article-detail surface without leaving article detail, showing monetization, or remaining on a transition or loading surface."



- waitForAnimationToEnd

- takeScreenshot: "Screenshots/Generated/SUB_WORLD_011_left_1"



