appId: com.mobstac.thehindu
tags:
  - generated
  - ordered
  - subscriber
  - trending
  - sections
  - no-monetisation
---

- runFlow: "../Common/OPEN_SUBSCRIBER_HOME.yaml"
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 30000
- assertVisible:
    id: "screen_home"
- tapOn:
    id: "nav_trending"
- extendedWaitUntil:
    visible:
      id: "screen_trending"
    timeout: 30000
- assertVisible:
    id: "screen_trending"
- assertVisible:
    id: "nav_trending"
    selected: true

# All
- tapOn:
    text: "All"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "screen_trending"
    timeout: 30000
- assertVisible:
    id: "screen_trending"
- assertVisible:
    text: "All"
- assertNotVisible:
    text: "SUBSCRIBE"
- assertNotVisible:
    text: "ADVERTISEMENT"
- assertNotVisible:
    id: "aw0"
- assertNotVisible:
    id: "ad_iframe"
- assertNotVisible:
    text: "Interstitial close button"
- assertNotVisible:
    text: "Image for Taboola Advertising Unit"
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_TREND_005_All_ad_free"

