appId: com.mobstac.thehindu
tags:
  - auth
  - apple_login
---
# login with appleid (SC-16).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml

# Navigate to Login Page
- extendedWaitUntil:
    visible: "HAVE AN ACCOUNT? LOGIN"
    timeout: 15000
- tapOn: "HAVE AN ACCOUNT? LOGIN"

# Verify Login Screen
- extendedWaitUntil:
    visible: "thehindu-logo"
    timeout: 15000
- extendedWaitUntil:
    visible: "Login to your account"
    timeout: 15000
- extendedWaitUntil:
    visible: "Don’t have an account ? "
    timeout: 15000
- assertVisible: "Sign in with Apple"
- assertVisible: "Sign in with Google"
- assertVisible: "If you have an account with The Hindu Businessline,\nThe Hindu e-Paper, Frontline, or Sportstar.\nYou can use the same account to login here."

# Verify Apple Sign-In
- tapOn: "Sign in with Apple"
- takeScreenshot: "Screenshots/SC_16/SC_16_Apple_signin_page"

# Verify Apple Sign-In Error
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible:
              text: "invalid_request"
          commands:
            - takeScreenshot: "Screenshots/SC_16/SC_16_signin_error_via_AppleID"
            - assertNotVisible:
                text: "invalid_request"
      - waitForAnimationToEnd

# Navigate Back
- back

# Close Application
- killApp

