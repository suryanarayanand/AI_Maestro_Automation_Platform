appId: com.mobstac.thehindu
tags: [anonymous, quick-access, podcast]
---
- runFlow:
    file: "../Common/OPEN_ANONYMOUS_QUICK_ACCESS.yaml"
    env:
      SECTION_NAME: "Podcast"

- swipe: {start: "50%,22%", end: "50%,78%", duration: 700}
- extendedWaitUntil: {visible: {text: "(?i)Podcast|Latest episode|Play"}, timeout: 120000}

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_PODCAST_002_evidence"
