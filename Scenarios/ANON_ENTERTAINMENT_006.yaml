appId: com.mobstac.thehindu
tags: [anonymous, quick-access, entertainment]
---
- runFlow:
    file: "../Common/OPEN_ANONYMOUS_QUICK_ACCESS.yaml"
    env:
      SECTION_NAME: "Entertainment"

- extendedWaitUntil: {visible: {id: "article_card"}, timeout: 120000}
- tapOn: {id: "article_card", index: 0}
- runFlow: "../Common/HANDLE_AI_SUMMARY_SHEET.yaml"
- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 30000}

- repeat:
    times: 6
    commands:
      - swipe: {direction: UP, duration: 600}
      - waitForAnimationToEnd
- runFlow:
    when: {visible: {text: "(?i)SUBSCRIBE|Keep reading|Already a subscriber"}}
    commands:
      - assertVisible: "(?i)SUBSCRIBE|Keep reading|Already a subscriber"
      - waitForAnimationToEnd
      - takeScreenshot: "Screenshots/Generated/ANON_ENTERTAINMENT_006_restriction"
- assertVisible: {id: "screen_article_detail"}
