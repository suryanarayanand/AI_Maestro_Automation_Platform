appId: com.mobstac.thehindu
tags: [subscriber, games, sc27]
---
- runFlow: ../Common/OPEN_SUBSCRIBER_GAMES.yaml
- scrollUntilVisible:
    element: {text: "^Quiz$"}
    direction: DOWN
    timeout: 60000
    speed: 55
    visibilityPercentage: 20
    centerElement: true
- tapOn: {text: "^Quiz$"}
- extendedWaitUntil:
    visible: {text: ".*(News )?Quiz.*"}
    timeout: 30000
- assertNotVisible: {text: ".*access was not found.*"}
- takeScreenshot: "Screenshots/SC_27/SC_27_News_Quiz"
