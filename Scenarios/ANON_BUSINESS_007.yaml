appId: com.mobstac.thehindu
tags: [anonymous, quick-access, business]
---
- runFlow:
    file: "../Common/OPEN_ANONYMOUS_QUICK_ACCESS.yaml"
    env:
      SECTION_NAME: "Business"

- extendedWaitUntil: {visible: {id: "article_card"}, timeout: 120000}
- tapOn: {id: "article_card", index: 0}
- runFlow: "../Common/HANDLE_AI_SUMMARY_SHEET.yaml"
- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 30000}

- repeat:
    times: 5
    commands:
      - runFlow:
          when: {notVisible: {text: "(?i)AI Summary|Listen to article"}}
          commands:
            - swipe: {direction: UP, duration: 500}
            - waitForAnimationToEnd
- runFlow:
    when: {visible: {text: "(?i)AI Summary|Listen to article"}}
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: "Screenshots/Generated/ANON_BUSINESS_007_optional_controls"
- assertVisible: {id: "screen_article_detail"}
