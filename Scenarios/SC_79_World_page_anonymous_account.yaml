---
# World page anonymous account (SC-79).
# Launch App
- launchApp:
    clearState: true
- waitForAnimationToEnd
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"

# Navigate to World Section
- extendedWaitUntil:
    visible: "World"
    timeout: 15000
- tapOn: "World"
- assertVisible: "SUBSCRIBE"

# Refresh World Page
- swipe:
    direction: DOWN
- takeScreenshot: "Screenshots/SC_79/SC_79_World_Page_After_Refresh"

