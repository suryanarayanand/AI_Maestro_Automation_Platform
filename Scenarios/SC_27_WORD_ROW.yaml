appId: com.mobstac.thehindu
tags: [subscriber, games, sc27]
---
- runFlow: ../Common/OPEN_SUBSCRIBER_GAMES.yaml
- scrollUntilVisible:
    element: {text: "Word Row"}
    timeout: 20000
- tapOn: {text: "Word Row"}
- scrollUntilVisible:
    element: {text: ".*(January|February|March|April|May|June|July|August|September|October|November|December).*"}
    direction: DOWN
    timeout: 60000
    speed: 55
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    text: ".*(January|February|March|April|May|June|July|August|September|October|November|December).*"
    index: 0
- runFlow:
    when: {visible: {text: "Dismiss"}}
    commands:
      - tapOn: {text: "Dismiss"}
- runFlow:
    when: {visible: {text: "Play solo"}}
    commands:
      - takeScreenshot: "Screenshots/SC_27/SC_27_Word_Row_Play_Mode"
      - tapOn: {text: "Play solo"}
- assertNotVisible: {text: ".*access was not found.*"}
- takeScreenshot: "Screenshots/SC_27/SC_27_Word_Row"
