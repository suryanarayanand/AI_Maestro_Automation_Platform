appId: com.mobstac.thehindu
tags: [anonymous, quick-access, podcast]
---
- runFlow:
    file: "../Common/OPEN_ANONYMOUS_QUICK_ACCESS.yaml"
    env:
      SECTION_NAME: "Podcast"

- tapOn: {text: "(?i)Play", optional: true}
- extendedWaitUntil: {notVisible: {text: "(?i)loading"}, timeout: 30000}

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_PODCAST_007_evidence"
