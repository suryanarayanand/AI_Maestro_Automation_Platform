appId: com.mobstac.thehindu
tags:
  - subscriber
  - sports
  - account
  - article
---
# Sports page subscribed account article (SC-94).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow: ../Common/LOGIN.yaml
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Navigate to Sports Section
- repeat:
    times: 4
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Sports"
    commands:
      - tapOn: "Sports"

# Open Football Article
- scrollUntilVisible:
    element: "FOOTBALL"
- assertVisible: "FOOTBALL"
- tapOn: "FOOTBALL"
- takeScreenshot: "Screenshots/SC_94/SC_94_Sports_Article_Football_Subscribed_Account_01"

# Verify Article Actions
- assertVisible: "AI summary"
- assertVisible:
    text: "Text size"
- assertVisible:
    text: "Bookmark"
- assertVisible:
    text: "Share"
- assertVisible:
    text: "Comment"
- scroll
- takeScreenshot: "Screenshots/SC_94/SC_94_Sports_Article_Football_Subscribed_Account_02"
- scroll
- takeScreenshot: "Screenshots/SC_94/SC_94_Sports_Article_Football_Subscribed_Account_03"
- scroll
- takeScreenshot: "Screenshots/SC_94/SC_94_Sports_Article_Football_Subscribed_Account_04"
- scroll
- takeScreenshot: "Screenshots/SC_94/SC_94_Sports_Article_Football_Subscribed_Account_05"
- scroll
- takeScreenshot: "Screenshots/SC_94/SC_94_Sports_Article_Football_Subscribed_Account_06"

# Verify Comment Section
- repeat:
    times: 15
    commands:
      - swipe:
          direction: DOWN
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            visible:
              text: "Post a comment"
          commands:
            - takeScreenshot: "Screenshots/SC_94/SC_94_Post_A_Comment_Tab"
      - scroll

# Verify Web Page Availability
- repeat:
    times: 20
    commands:
      - swipe:
          direction: DOWN
- repeat:
    times: 20
    commands:
      # Verify webpage is available
      - assertNotVisible:
          text: "Web page not available"
      # Continue navigation
      - scroll
      - takeScreenshot: "Screenshots/SC_94/SC_94_Web_Page_Not_Available"
      - waitForAnimationToEnd
