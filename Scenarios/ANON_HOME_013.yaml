appId: com.mobstac.thehindu
tags: [generated, ordered, anonymous, comment, login-gate, conditional-paywall]
---
- runFlow: "../Common/OPEN_ANONYMOUS_HOME.yaml"
- tapOn: {id: "article_card", index: 0}
- tapOn: {text: "Close sheet", optional: true}
- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 25000}
- repeat:
    times: 15
    commands:
      - runFlow:
          when: {visible: {text: "Already a subscriber.*|Keep reading.*free for 3 days|.*[0-9]+%.*off.*"}}
          commands:
            - assertVisible: {text: "Login|LOGIN|Sign in|SIGN IN"}
            - waitForAnimationToEnd
            - takeScreenshot: "Screenshots/Generated/ANON_HOME_013_paywall_comment_not_applicable"
      - runFlow:
          when: {visible: {text: "Post a comment"}}
          commands:
            - assertVisible: {text: "Post a comment"}
            - tapOn: {text: "Post a comment"}
            - extendedWaitUntil: {visible: {text: "SIGN IN AND JOIN THE CONVERSATION.*"}, timeout: 25000}
            - assertVisible: {text: "SIGN IN AND JOIN THE CONVERSATION.*"}
            - waitForAnimationToEnd
            - takeScreenshot: "Screenshots/Generated/ANON_HOME_013_comment_login"
            - back
            - extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 25000}
      - swipe: {direction: UP}
      - waitForAnimationToEnd
- assertVisible: {id: "screen_article_detail"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_HOME_013_comment_or_paywall_result"
