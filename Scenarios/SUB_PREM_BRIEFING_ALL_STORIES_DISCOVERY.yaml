appId: com.mobstac.thehindu
tags: [discovery, subscriber, premium, briefing, all-stories]
---
- runFlow: "../Common/OPEN_SUBSCRIBER_PREMIUM.yaml"
- tapOn: {text: "Briefing"}
- waitForAnimationToEnd
- assertVisible: {id: "screen_premium"}
- assertNotVisible: {text: "Unlock Briefing.*|SUBSCRIBE|Already a subscriber.*|Login to your account"}
- runFlow: "../Common/ASSERT_SUBSCRIBER_NO_MONETIZATION.yaml"
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_briefing_unlocked"
- repeat:
    times: 4
    commands:
      - swipe: {direction: UP}
      - waitForAnimationToEnd: {timeout: 1600}
- assertNotVisible: {text: "Unlock Briefing.*|SUBSCRIBE|Already a subscriber.*"}
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_briefing_scrolled"
- tapOn: {text: "All Stories"}
- waitForAnimationToEnd
- assertVisible: {id: "screen_premium"}
- runFlow: "../Common/ASSERT_SUBSCRIBER_NO_MONETIZATION.yaml"
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_all_stories_top"
- repeat:
    times: 6
    commands:
      - swipe: {direction: UP}
      - waitForAnimationToEnd: {timeout: 1600}
      - runFlow: "../Common/ASSERT_SUBSCRIBER_NO_MONETIZATION.yaml"
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_all_stories_lower"
- extendedWaitUntil: {visible: {id: "article_card"}, timeout: 30000}
- tapOn: {id: "article_card", index: 0}
- tapOn: {text: "Close sheet", optional: true}
- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 30000}
- repeat:
    times: 8
    commands:
      - swipe: {direction: UP}
      - waitForAnimationToEnd: {timeout: 1600}
      - assertNotVisible: {text: "SUBSCRIBE|Already a subscriber.*|Keep reading.*|Login to your account"}
- runFlow: "../Common/ASSERT_SUBSCRIBER_NO_MONETIZATION.yaml"
- takeScreenshot: "Screenshots/Discovery/SUB_PREM_all_stories_article_full_access"
