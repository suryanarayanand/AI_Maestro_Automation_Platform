appId: com.mobstac.thehindu
tags:
  - auth
---
# Invalid Credentials Error Handling (SC-09).
# Launch App
- launchApp:
    clearState: true

# - runFlow: ../Common/OOBE_terms_and_condition.yaml
# Login with Invalid Credentials
- runFlow:
    when:
      visible:
        text: "HAVE AN ACCOUNT? LOGIN"
    commands:
      - tapOn: "HAVE AN ACCOUNT? LOGIN"
      - waitForAnimationToEnd:
          timeout: 15000
      - extendedWaitUntil:
          visible:
            text: "Email"
          timeout: 150000
      - tapOn: "Email"
      - inputRandomEmail
      - waitForAnimationToEnd:
          timeout: 30000
      - extendedWaitUntil:
          visible:
            text: "NEXT→"
          timeout: 80000
      - tapOn: "NEXT→"
      - waitForAnimationToEnd:
          timeout: 80000
      - extendedWaitUntil:
          visible:
            text: "password"
          timeout: 100000
      - tapOn: "password"
      - inputText: "T%$#1234n"
      - waitForAnimationToEnd:
          timeout: 30000
      - runFlow:
          when:
            visible:
              text: "Show password"
          commands:
            - tapOn: "Show password"
      - extendedWaitUntil:
          visible:
            text: "LOGIN→"
          timeout: 80000
      - tapOn: "LOGIN→"

# Verify Invalid Login Error
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible: "That combination of email and password is not recognized"
    timeout: 15000
- assertVisible: "That combination of email and password is not recognized"
- takeScreenshot: "Screenshots/SC_09/SC_09_InvalidCredentials_Error"

# Close Application
- stopApp
