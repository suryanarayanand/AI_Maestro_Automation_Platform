appId: com.mobstac.thehindu
tags: [generated, ordered, anonymous, editorial]
---
- runFlow: "../Common/OPEN_ANONYMOUS_EDITORIAL_ARTICLE.yaml"
- scrollUntilVisible:
    element: {text: "Keep reading.*|.*[0-9]+%.*off.*|Go beyond the headline.*|Already a subscriber.*"}
    direction: DOWN
    timeout: 45000
    speed: 55
- assertVisible: {text: "Keep reading.*|.*[0-9]+%.*off.*|Go beyond the headline.*|Already a subscriber.*"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_EDITORIAL_008_paywall"
- scrollUntilVisible:
    element: {text: "Already a subscriber.*|Login"}
    direction: DOWN
    timeout: 90000
    speed: 55
- assertVisible: {text: "Already a subscriber.*|Login"}
