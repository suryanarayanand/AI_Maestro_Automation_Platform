appId: com.mobstac.thehindu
tags:
  - generated
  - ordered
  - subscriber
  - photos
  - entitlement
  - no-monetisation
  - evidence-limited
---

# Position 1: Establish the authenticated subscriber Home state and open Photos
# from Quick Access with the validated Photos text selector.
- runFlow: "../Common/OPEN_SUBSCRIBER_HOME.yaml"

- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 30000

- assertVisible:
    id: "screen_home"

- extendedWaitUntil:
    visible:
      text: "Photos"
    timeout: 30000

- tapOn:
    text: "Photos"

- waitForAnimationToEnd

# Position 2: Confirm that the app remains on its Home-derived content surface
# and that the validated subscriber no-ad entitlement signal remains active.
- assertVisible:
    id: "screen_home"

- assertNotVisible:
    text: "ADVERTISEMENT"

# Position 3: Confirm that the Photos label remains rendered after selection.
# The screenshot captures the settled visual state for review of highlighting.
- extendedWaitUntil:
    visible:
      text: "Photos"
    timeout: 30000

- assertVisible:
    text: "Photos"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_PHOTO_001_photos_selected"

# Position 4: Verify the supplied subscription and login-gate surfaces are absent,
# then apply the shared subscriber no-monetisation assertions on the settled page.
- assertNotVisible:
    text: "SUBSCRIBE"

- assertNotVisible:
    id: "cta_login"

- assertNotVisible:
    text: '^Already a [Ss]ubscriber\? Login$'

- runFlow: "../Common/ASSERT_SUBSCRIBER_NO_MONETIZATION.yaml"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_PHOTO_001_subscriber_entitlement"
