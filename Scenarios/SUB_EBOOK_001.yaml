appId: com.mobstac.thehindu

tags: [generated, ordered, subscriber, ebooks, entitlement, no-monetisation]

---

# Position 1: establish the configured subscriber session and open eBooks.
- runFlow: "../Common/OPEN_SUBSCRIBER_HOME.yaml"

- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 30000

- assertVisible:
    id: "screen_home"

- tapOn:
    id: "nav_ebooks"

# Position 2: wait for the validated eBooks landing screen and capture it.
- extendedWaitUntil:
    visible:
      id: "screen_ebooks"
    timeout: 30000

- assertVisible:
    id: "screen_ebooks"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_EBOOK_001_ebooks_landing"

# Position 3: verify subscriber-only monetisation and authentication surfaces are absent.
- assertNotVisible:
    text: "SUBSCRIBE"

- assertNotVisible:
    id: "cta_login"

- assertNotVisible:
    text: "ADVERTISEMENT"

- assertNotVisible:
    id: "aw0"

- assertNotVisible:
    text: "Image for Taboola Advertising Unit"

# Position 4: prove the eBooks destination is open and its navigation item remains present.
- assertVisible:
    id: "screen_ebooks"

- assertVisible:
    id: "nav_ebooks"

# Position 5: save settled, assertion-backed landing evidence.
- assertVisible:
    id: "screen_ebooks"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_EBOOK_001_ebooks_landing_settled"

# Position 6: final proof that the entitled landing page remains free of a monetisation gate.
- assertVisible:
    id: "screen_ebooks"

- assertNotVisible:
    text: "SUBSCRIBE"

- assertNotVisible:
    id: "cta_login"

- assertNotVisible:
    text: "ADVERTISEMENT"

- assertNotVisible:
    id: "aw0"

- assertNotVisible:
    text: "Image for Taboola Advertising Unit"
