appId: com.mobstac.thehindu
tags: [generated, ordered, anonymous, article-controls]
---
- runFlow: "../Common/OPEN_ANONYMOUS_HOME.yaml"
- tapOn: {id: "article_card", index: 0}
- tapOn: {text: "Close sheet", optional: true}
- tapOn: {text: "Interstitial close button", optional: true}
- extendedWaitUntil: {visible: {id: "screen_article_detail"}, timeout: 25000}
- assertVisible: {id: "screen_article_detail"}
- runFlow:
    when: {visible: {text: "AI Summary|AI summary|Summary"}}
    commands:
      - assertVisible: {text: "AI Summary|AI summary|Summary"}
- runFlow:
    when: {visible: {text: "Bookmark"}}
    commands:
      - assertVisible: {text: "Bookmark"}
- runFlow:
    when: {visible: {text: "Share"}}
    commands:
      - assertVisible: {text: "Share"}
- runFlow:
    when: {visible: {text: "Post a comment"}}
    commands:
      - assertVisible: {text: "Post a comment"}
- assertVisible: {text: "SUBSCRIBE"}
