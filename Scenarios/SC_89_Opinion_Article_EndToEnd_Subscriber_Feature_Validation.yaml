appId: com.mobstac.thehindu
tags:
  - subscriber
  - opinion
  - article
---
# Opinion Article EndToEnd Subscriber Feature Validation (SC-89).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow: ../Common/LOGIN.yaml
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Navigate to Opinion Section
- repeat:
    times: 3
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- assertVisible: "Opinion"
- tapOn: "Opinion"
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Subscriber_Account"
# Open Commemts in a Article
- scrollUntilVisible:
    element: "Comment"
- tapOn: "Comment"

- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Subscriber_Account_Article_Via_Comment_Section"
# AI Summary
- extendedWaitUntil:
    visible: "Summary"
    timeout: 15000
- tapOn: "Summary"
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_After_Clicking_AI_Summary"
- waitForAnimationToEnd
- tapOn: "Close sheet"

# Verify Article Actions
- assertVisible:
    text: "Text size"
- waitForAnimationToEnd
- assertVisible:
    text: "Bookmark"
- assertVisible:
    text: "Share"
- assertVisible:
    text: "Comment"

# Article Validation
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_01"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_02"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_03"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_04"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_05"

- back

- scrollUntilVisible:
    element:
      text: "EDITORIAL"
    timeout: 15000
- tapOn: "EDITORIAL"

# # AI Summary
# - extendedWaitUntil:
#     visible: "Summary"
#     timeout: 15000
# - tapOn: "Summary"

# - takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_After_Clicking_AI_Summary"
# - waitForAnimationToEnd
# - tapOn: "Close sheet"


# Continue Article Validation
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_06"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_07"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Article_08"

# Open Next Article
- swipe:
    direction: LEFT

- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Second_Article_01"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Second_Article_02"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Second_Article_03"
- scroll
- takeScreenshot: "Screenshots/SC_89/SC_89_Opinion_Page_Second_Article_04"
- back

# Navigate to Letters Section
- repeat:
    times: 3
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- assertVisible: "Opinion"
- tapOn: "Opinion"
- scrollUntilVisible:
    element: "LETTERS"
- extendedWaitUntil:
    visible: "LETTERS"
    timeout: 15000
- tapOn: "LETTERS"

