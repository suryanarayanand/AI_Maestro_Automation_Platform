appId: com.mobstac.thehindu
tags: [anonymous, quick-access, latest]
---
- runFlow:
    file: "../Common/OPEN_ANONYMOUS_QUICK_ACCESS.yaml"
    env:
      SECTION_NAME: "Latest News"

- assertVisible: {text: "(?i)^Latest News$"}
- assertVisible: {id: "screen_home"}

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_LATEST_001_selected"
