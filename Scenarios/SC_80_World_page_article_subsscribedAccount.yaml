appId: com.mobstac.thehindu
tags:
  - world
  - account
  - article
---
# World page article subsscribedAccount (SC-80).
# Launch App
- launchApp:
    clearState: true
- waitForAnimationToEnd
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow: ../Common/LOGIN.yaml
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "The Hindu"
    timeout: 15000

# Navigate to World Section
- extendedWaitUntil:
    visible: "World"
    timeout: 15000
- tapOn: "World"
- waitForAnimationToEnd
- tapOn:
    point: 50%,50%
- waitForAnimationToEnd

# The frequency-capped AI Summary sheet can cover the article action bar.

- runFlow:

    when:

      visible:

        text: "Summary"

    commands:

      - tapOn: "Close sheet"

# Verify Article Actions
- repeat:
    times: 3
    commands:
      - swipe:
          direction: LEFT
- waitForAnimationToEnd
- assertVisible:
    text: "Text size"
- waitForAnimationToEnd
- assertVisible:
    text: "Bookmark"
- assertVisible:
    text: "Share"
- assertVisible:
    text: "Comment"
- extendedWaitUntil:
    visible: "Listen to article"

# Verify AI Summary
- runFlow:
    when:
      visible:
        text: "AI summary"
    commands:
      - takeScreenshot: "Screenshots/SC_80/SC_80_World_Page_AI_Summary"

