appId: com.mobstac.thehindu
tags:
  - subscriber
  - article
---
# Subscriber Article Full Read Access (SC-12).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow: ../Common/LOGIN.yaml

# Skip Onboarding
- assertVisible:
    text: "Welcome to a new\nThe Hindu experience"
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Open Home Article
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    point: 50%,50%
- waitForAnimationToEnd


# Verify closing Summary
- runFlow:
    when:
      visible:
        text: "Summary"
    commands:
      - tapOn: "Close sheet"

# Capture Article Title
- copyTextFrom:
    point: 50%,12%
- evalScript: ${output.articleTitle = maestro.copiedText}
- evalScript: ${console.log(output.articleTitle)}




# Continue Subscriber Article Validation
- takeScreenshot: "Screenshots/SC_12/SC_12_Subscriber_Article_page_1"
- scroll
- takeScreenshot: "Screenshots/SC_12/SC_12_Subscriber_Article_page_2"
- scroll
- takeScreenshot: "Screenshots/SC_12/SC_12_Subscriber_Article_page_3"