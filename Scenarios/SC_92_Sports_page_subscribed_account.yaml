appId: com.mobstac.thehindu
tags:
  - subscriber
  - sports
  - account
---
# Sports page subscribed account (SC-92).
# Launch App
- launchApp:
    clearState: true
# - runFlow: ../Common/OOBE_terms_and_condition.yaml
- runFlow: ../Common/LOGIN.yaml
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn: "Skip"

# Navigate to Sports Section
- repeat:
    times: 4
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Sports"
    commands:
      - tapOn: "Sports"

# Sports Page Validation
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_92/SC_92_SportsPage_Subscribed_Account_01"
