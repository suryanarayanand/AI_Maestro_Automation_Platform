- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_92/SC_92_SportsPage_Subscribed_Account_02"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_92/SC_92_SportsPage_Subscribed_Account_03"
- scroll
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/SC_92/SC_92_SportsPage_Subscribed_Account_04"
