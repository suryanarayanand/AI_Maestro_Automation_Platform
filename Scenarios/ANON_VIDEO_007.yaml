appId: com.mobstac.thehindu

tags: [generated, ordered, anonymous, videos]

---

- runFlow: "../Common/OPEN_ANONYMOUS_VIDEO_ARTICLE.yaml"

- scrollUntilVisible:

    element: {text: "Keep reading.*|.*[0-9]+%.*off.*|Go beyond the headline.*|Already a subscriber.*|SUBSCRIBE|Subscribe"}

    direction: DOWN

    timeout: 45000

    speed: 40

- assertVisible: {text: "Subscribe|SUBSCRIBE"}

- tapOn: {text: "Subscribe|SUBSCRIBE", index: 0}

- extendedWaitUntil: {visible: {text: "Yearly|Monthly|Choose a plan|View offers|Offer"}, timeout: 30000}

- assertVisible: {text: "Yearly|Monthly|Choose a plan|View offers|Offer"}

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_VIDEO_007_plans"

- back

- assertVisible: {id: "screen_article_detail"}

