appId: com.mobstac.thehindu

tags:
  - generated
  - ordered
  - subscriber
  - article
  - reading-options
  - text-size
  - blocked-grounding

---

# SUB_ARTICLE_005 — Reading options and text sizes
#
# This replacement safely validates the subscriber article precondition, then
# terminates as blocked. It cannot manipulate Reading Options without inventing
# selectors for the trigger, increase, decrease, or close controls.

- runFlow: "../Common/OPEN_SUBSCRIBER_HOME.yaml"

# Open one stable Article Library reference. The target execution must confirm
# that this reference still resolves to article detail on the current build.
- openLink: "https://www.thehindu.com/sci-tech/technology/gadgets/redmi-pad-pro-5g-and-redmi-pad-se-4g-launched-in-india-features-price/article68459826.ece"

- extendedWaitUntil:
    visible:
      id: "screen_article_detail"
    timeout: 30000

- assertVisible:
    id: "screen_article_detail"

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_ARTICLE_005_article_baseline"

# Positions 1–3 and the control-response portion of position 4 are deliberately
# not fabricated. The supplied Text size hierarchy node is unvalidated and is
# explicitly marked non-clickable; no grounded Reading Options trigger,
# increase, decrease, close, article-body anchor, or clipping assertion exists.
# Fail explicitly so this grounding check cannot be reported as a case PASS.
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/SUB_ARTICLE_005_manual_review"
