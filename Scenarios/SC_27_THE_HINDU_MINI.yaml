appId: com.mobstac.thehindu
tags:
  - subscriber
  - games
  - sc27
---
- runFlow: ../Common/OPEN_SUBSCRIBER_GAMES.yaml
- scrollUntilVisible:
    element:
      text: "The Hindu Mini"
    timeout: 20000
- tapOn:
    text: "The Hindu Mini"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: ".*(January|February|March|April|May|June|July|August|September|October|November|December).*"
    timeout: 20000
- tapOn:
    text: ".*(January|February|March|April|May|June|July|August|September|October|November|December).*"
    index: 0
- runFlow:
    when:
      visible:
        text: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 20000
- assertNotVisible:
    text: ".*access was not found.*"
- assertVisible: "Settings"
- assertVisible: "Assist"
- assertVisible:
    id: "main-nav"
- takeScreenshot: "Screenshots/SC_27/SC_27_The_Hindu_Mini"
