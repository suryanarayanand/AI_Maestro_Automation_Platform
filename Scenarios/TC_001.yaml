appId: com.mobstac.thehindu
tags: [generated, ordered, subscriber, ebooks]
---
- runFlow: "../Common/OPEN_SUBSCRIBER_HOME.yaml"
- tapOn:
    id: "nav_ebooks"
- extendedWaitUntil:
    visible:
      id: "screen_ebooks"
    timeout: 20000
- assertVisible:
    id: "screen_ebooks"
- takeScreenshot: "Screenshots/Generated/TC_001_e_paper_home_page"
- swipe:
    direction: "UP"
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/TC_001_e_paper_listing_page"
