appId: com.mobstac.thehindu
tags: [anonymous, quick-access, podcast]
---
- runFlow:
    file: "../Common/OPEN_ANONYMOUS_QUICK_ACCESS.yaml"
    env:
      SECTION_NAME: "Podcast"

- repeat:
    times: 5
    commands:
      - swipe: {direction: UP, duration: 600}
      - waitForAnimationToEnd

- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_PODCAST_004_evidence"
