appId: com.mobstac.thehindu
tags: [subscriber, games, sc27]
---
- runFlow: ../Common/OPEN_SUBSCRIBER_GAMES.yaml
- extendedWaitUntil:
    visible: {text: ".*(Cryptic Crossword|Cryptic).*"}
    timeout: 20000
- tapOn: {text: ".*(Cryptic Crossword|Cryptic).*"}
- extendedWaitUntil:
    visible: {text: ".*(Cryptic Crossword|Cryptic).*"}
    timeout: 20000
- tapOn: {point: "18%,47%"}
- extendedWaitUntil:
    visible:
      text: ".*crossword puzzle.*"
    timeout: 30000
- tapOn:
    text: ".*crossword puzzle.*"
    index: 0
- runFlow:
    when: {visible: {text: "Dismiss"}}
    commands:
      - tapOn: {text: "Dismiss"}
# Current PuzzleMe builds show a play-mode modal instead of Dismiss.
- extendedWaitUntil:
    visible: "Play solo|Settings"
    timeout: 30000
- runFlow:
    when:
      visible: "Play solo"
    commands:
      - takeScreenshot: "Screenshots/SC_27/SC_27_Cryptic_Play_Mode"
      - tapOn: "Play solo"
- extendedWaitUntil:
    visible: {text: "Settings"}
    timeout: 30000
- assertVisible: "Assist"
- assertVisible: {id: "main-nav"}
- takeScreenshot: "Screenshots/SC_27/SC_27_Cryptic_Crossword"
