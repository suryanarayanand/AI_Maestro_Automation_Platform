appId: com.mobstac.thehindu
tags:
  - anonymous
  - article
  - functional
  - generated
  - review-required
---
# Generated from: Verify AI summary button / icon is appearing for the applicable article and on tapping, it should open the summary pop up and show the respective Articles Summary, FAQ's and Related articles.
# Grounding: validated locator repository; 8 matching App Memory records.
- runFlow: "../../Common/OPEN_ANONYMOUS_HOME.yaml"
- assertVisible:
    text: "SUBSCRIBE"
- repeat:
    while:
      notVisible:
        text: "ADVERTISEMENT"
    times: 8
    commands:
      - swipe:
          direction: "UP"
      - waitForAnimationToEnd
- assertVisible:
    text: "ADVERTISEMENT"
- tapOn:
    id: "nav_home"
- extendedWaitUntil:
    visible:
      id: "screen_home"
    timeout: 15000
- tapOn:
    id: "article_card"
    index: 0
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "Close sheet"
    optional: true
- tapOn:
    text: "Interstitial close button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "screen_article_detail"
    timeout: 25000
- assertVisible:
    id: "screen_article_detail"
- tapOn:
    text: "AI Summary|Summary"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Login|Subscribe|Go beyond the headline.*"
    timeout: 15000
- assertVisible:
    text: "Login|Subscribe|Go beyond the headline.*"
