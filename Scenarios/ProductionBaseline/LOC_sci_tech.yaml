appId: com.mobstac.thehindu
tags:
  - baseline
  - sci_tech
---
- runFlow: ../Common/OPEN_HOME_FOR_BASELINE.yaml
- tapOn:
    point: "6%,10%"
- extendedWaitUntil:
    visible:
      text: "Science"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Science"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Science"
- extendedWaitUntil:
    visible:
      text: "Sci-Tech"
    timeout: 15000
- tapOn:
    text: "Sci-Tech"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Sci-Tech"
    timeout: 20000
- assertVisible:
    text: "Sci-Tech"
- takeScreenshot: "Screenshots/LocatorSmoke/sci_tech_page"
