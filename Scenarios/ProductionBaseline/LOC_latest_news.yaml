appId: com.mobstac.thehindu
tags:
  - baseline
  - latest_news
---
- runFlow: ../Common/OPEN_HOME_FOR_BASELINE.yaml
- tapOn:
    point: "6%,10%"
- extendedWaitUntil:
    visible:
      text: "News"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "News"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "News"
- extendedWaitUntil:
    visible:
      text: "News"
    timeout: 15000
- tapOn:
    point: "15%,62%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "News"
    timeout: 20000
- assertVisible:
    text: "News"
- takeScreenshot: "Screenshots/LocatorSmoke/latest_news_page"
