appId: com.mobstac.thehindu
tags:
  - baseline
  - sports
---
- runFlow: ../Common/OPEN_HOME_FOR_BASELINE.yaml
- repeat:
    times: 5
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Sports\nTab 9 of 15"
    timeout: 15000
- tapOn:
    text: "Sports\nTab 9 of 15"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Sports\nTab 9 of 15"
    timeout: 20000
- assertVisible:
    text: "Sports\nTab 9 of 15"
- takeScreenshot: "Screenshots/LocatorSmoke/sports_page"
