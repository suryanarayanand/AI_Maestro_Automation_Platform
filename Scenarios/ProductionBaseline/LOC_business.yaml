appId: com.mobstac.thehindu
tags:
  - baseline
  - business
---
- runFlow: ../Common/OPEN_HOME_FOR_BASELINE.yaml
- repeat:
    times: 5
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Business\nTab 10 of 15"
    timeout: 15000
- tapOn:
    text: "Business\nTab 10 of 15"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Business\nTab 10 of 15"
    timeout: 20000
- assertVisible:
    text: "Business\nTab 10 of 15"
- takeScreenshot: "Screenshots/LocatorSmoke/business_page"
