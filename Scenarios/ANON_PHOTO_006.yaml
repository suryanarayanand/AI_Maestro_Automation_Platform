appId: com.mobstac.thehindu
tags: [generated, ordered, anonymous, photos]
---
- runFlow: "../Common/OPEN_ANONYMOUS_MULTI_PHOTO_GALLERY.yaml"
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_PHOTO_006_counter_1"
- swipe: {direction: LEFT, duration: 500}
- waitForAnimationToEnd
- assertVisible: {text: ".*2/[0-9]+.*"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_PHOTO_006_counter_2"
- swipe: {direction: LEFT, duration: 500}
- waitForAnimationToEnd
- assertVisible: {text: ".*3/[0-9]+.*"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_PHOTO_006_counter_3"
- swipe: {direction: RIGHT, duration: 500}
- waitForAnimationToEnd
- assertVisible: {text: ".*2/[0-9]+.*"}
- waitForAnimationToEnd
- takeScreenshot: "Screenshots/Generated/ANON_PHOTO_006_counter_back_2"
