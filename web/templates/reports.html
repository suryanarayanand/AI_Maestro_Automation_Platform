{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Reports</h2>

    <div class="mb-3"><a href="{{ url_for('report.unique_bugs') }}" class="btn btn-success">View Unique Bug Summary</a></div>

    <table class="table table-bordered table-hover">

        <thead>
            <tr>
                <th>Execution</th>
                <th width="120">Action</th>
            </tr>
        </thead>

        <tbody>

        {% for report in reports %}

        <tr>

            <td>{{ report.name }}</td>

            <td>

                <a
                    href="/reports/{{ report.name }}"
                    class="btn btn-primary btn-sm">

                    View

                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
