{% extends "base.html" %}
{% block title %}Manage {{ suite.name }}{% endblock %}
{% block page_title %}Manage {{ suite.name }}{% endblock %}
{% block content %}
<p class="page-intro">Add, remove, and reorder test scenarios. Saving updates <code>Suites/{{ suite.key }}.json</code>.</p>
<form id="suite-editor" method="post" class="surface">
    <div class="suite-manager">
        <section>
            <label class="form-label fw-semibold" for="available-search">Available scenarios</label>
            <input id="available-search" class="form-control mb-2" type="search" placeholder="Search scenarios">
            <select id="available-tests" class="form-select suite-list" multiple aria-label="Available scenarios">
                {% for yaml in suite.available %}<option value="{{ yaml }}">{{ yaml }}</option>{% endfor %}
            </select>
        </section>
        <div class="suite-manager-actions">
            <button class="btn btn-outline-primary" type="button" id="add-tests">Add →</button>
            <button class="btn btn-outline-secondary" type="button" id="remove-tests">← Remove</button>
        </div>
        <section>
            <label class="form-label fw-semibold" for="selected-tests">Selected scenarios (execution order)</label>
            <select id="selected-tests" class="form-select suite-list" multiple aria-label="Selected scenarios">
                {% for test in suite.tests %}<option value="{{ test.yaml|replace('\\', '/') }}">{{ test.id }} — {{ test.name }} ({{ test.yaml|replace('\\', '/') }})</option>{% endfor %}
            </select>
            <div class="d-flex gap-2 mt-2">
                <button class="btn btn-sm btn-outline-secondary" type="button" id="move-up">Move Up</button>
                <button class="btn btn-sm btn-outline-secondary" type="button" id="move-down">Move Down</button>
            </div>
        </section>
    </div>
    <div id="ordered-fields"></div>
    <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Save Suite</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('suite.suites') }}">Cancel</a>
    </div>
</form>
<script>
(() => {
    const available = document.getElementById('available-tests');
    const selected = document.getElementById('selected-tests');
    const moveOptions = (from, to) => [...from.selectedOptions].forEach(option => to.add(option));
    document.getElementById('add-tests').onclick = () => moveOptions(available, selected);
    document.getElementById('remove-tests').onclick = () => moveOptions(selected, available);
    document.getElementById('move-up').onclick = () => {
        [...selected.selectedOptions].forEach(option => {
            const previous = option.previousElementSibling;
            if (previous && !previous.selected) selected.insertBefore(option, previous);
        });
    };
    document.getElementById('move-down').onclick = () => {
        [...selected.selectedOptions].reverse().forEach(option => {
            const next = option.nextElementSibling;
            if (next && !next.selected) selected.insertBefore(next, option);
        });
    };
    document.getElementById('available-search').oninput = event => {
        const query = event.target.value.toLowerCase();
        [...available.options].forEach(option => option.hidden = !option.text.toLowerCase().includes(query));
    };
    document.getElementById('suite-editor').onsubmit = () => {
        const fields = document.getElementById('ordered-fields');
        fields.replaceChildren(...[...selected.options].map(option => {
            const input = document.createElement('input');
            input.type = 'hidden'; input.name = 'tests'; input.value = option.value;
            return input;
        }));
    };
})();
</script>
{% endblock %}
