{% extends "base.html" %}
{% block title %}Edit YAML{% endblock %}
{% block page_title %}Edit YAML{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><div><p class="page-intro mb-0">{{ scenario_path }}</p><small class="text-muted">Saving validates the Maestro structure and creates a backup first.</small></div><a class="btn btn-outline-secondary" href="{{ url_for('yaml_editor.index') }}">Back to files</a></div>
<form method="post" class="surface"><textarea class="form-control font-monospace yaml-editor-area" name="yaml" rows="32" spellcheck="false" required>{{ yaml_content }}</textarea><div class="d-flex justify-content-between mt-3"><button class="btn btn-outline-danger" type="submit" form="delete-yaml-form">Delete</button><button class="btn btn-success">Validate and Save</button></div></form>
<form id="delete-yaml-form" method="post" action="{{ url_for('yaml_editor.delete') }}" onsubmit="return confirm('Delete {{ scenario_path }}? A recovery backup will be retained.');"><input type="hidden" name="file" value="{{ scenario_path }}"></form>
{% endblock %}
